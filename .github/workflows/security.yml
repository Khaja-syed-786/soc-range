name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'  # Mondays 05:17 UTC: catches new advisories even when nothing is pushed
  workflow_dispatch:

# Read-only by default; only the CodeQL job gets more
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript: the app and tests. actions: the workflow files (e.g. script injection)
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  audit-prod:
    name: Dependency audit (production, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (runtime dependencies, fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  audit-full:
    name: Dependency audit (all, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Informational by design. npm audit exits 1 when it finds anything, so the call sits in an `if`:
      # its exit status becomes data instead of failing the step. The summary script exits non-zero
      # when the output is not a valid audit report (registry or network error, npm crash), so the job
      # never goes green without actually having audited. Findings go to the job summary.
      - name: npm audit, including dev dependencies (report only)
        run: |
          if npm audit --json > audit.json; then rc=0; else rc=$?; fi
          echo "npm audit exit code: $rc (1 means findings; reported below, not a failure)"
          bash .github/scripts/npm-audit-summary.sh audit.json > summary.md
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
