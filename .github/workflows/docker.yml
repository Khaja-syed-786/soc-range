name: Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; no job here needs more
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint (version- and checksum-pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict
          chmod +x hadolint
      - name: hadolint (fails on any finding, including info)
        run: '"$RUNNER_TEMP/hadolint" --failure-threshold info Dockerfile'

  scan:
    name: Build and scan image (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t soc-range:ci .
      # The binary, not aquasecurity/trivy-action: same version + checksum pinning as gitleaks and hadolint
      - name: Install Trivy (version- and checksum-pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
      # No --ignore-unfixed: an unfixed HIGH/CRITICAL fails the build too, so it gets looked at and either
      # fixed by a base-image change or suppressed narrowly in .trivyignore with a reason.
      - name: Trivy scan (fails on HIGH or CRITICAL)
        run: >-
          "$RUNNER_TEMP/trivy" image
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --exit-code 1
          --no-progress
          soc-range:ci

  smoke:
    name: Smoke test (docker compose, README quickstart)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run the README "Run with Docker" commands
        run: |
          awk '/<!-- docker-quickstart/{f=1;next} /<!-- \/docker-quickstart -->/{f=0} f && !/^```/' README.md \
            > "$RUNNER_TEMP/quickstart.sh"
          echo "Commands from README.md:"; cat "$RUNNER_TEMP/quickstart.sh"
          grep -q 'docker compose up' "$RUNNER_TEMP/quickstart.sh"
          bash -euxo pipefail "$RUNNER_TEMP/quickstart.sh"

      # The assertions live in a script shared with release.yml, which runs them against the image it releases
      - name: API and console answer correctly
        run: bash .github/scripts/smoke-assertions.sh api

      - name: Port is published on 127.0.0.1 only
        run: bash .github/scripts/smoke-assertions.sh port

      - name: Container is non-root, read-only and hardened
        run: bash .github/scripts/smoke-assertions.sh hardening

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v
