name: Release

# A pushed vX.Y.Z tag releases: gate -> build/scan/smoke/SBOM -> push to GHCR, sign and attest by digest ->
# GitHub Release with changelog and SBOM.
#
# DRY RUN: a manual run (workflow_dispatch) or a pull request that changes the release pipeline runs the gate,
# the build, Trivy, the smoke test, the SBOM, the changelog and a release-notes preview, then stops. The
# publish and release jobs only run for a pushed vX.Y.Z tag (their `if:` below), so a dry run never pushes an
# image, signs anything or creates a release, and never gets the write permissions those two jobs hold.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - cliff.toml

# Read-only by default; jobs that need more say why next to the permission
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release half-way through publishing

env:
  IMAGE: ghcr.io/khaja-syed-786/soc-range

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read  # read the CI, Docker and Security runs for this commit
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needs main's history for the on-main check
          persist-credentials: false
      - name: Release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || 'dry-run' }}
          # For a pull request, check the PR's head commit (github.sha is the temporary merge commit)
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-verify.sh
          echo "version=$(jq -er '.version' package.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build, scan and smoke-test image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      SYFT_VERSION: 1.54.0
      SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (linux/amd64)
        run: docker build --platform linux/amd64 --build-arg REVISION="$GITHUB_SHA" -t soc-range:local .
      - name: OCI labels are set
        run: bash .github/scripts/check-oci-labels.sh soc-range:local "$GITHUB_SHA"
      - name: Install Trivy and Syft (version- and checksum-pinned)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz syft
      - name: Trivy scan (fails on HIGH or CRITICAL)
        run: >-
          "$RUNNER_TEMP/trivy" image
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --exit-code 1
          --no-progress
          soc-range:local
      - name: Start the built image with compose (no rebuild)
        run: docker compose up -d --no-build --wait
      # Same assertions as docker.yml's smoke test, from the shared script
      - name: API and console answer correctly
        run: bash .github/scripts/smoke-assertions.sh api
      - name: Port is published on 127.0.0.1 only
        run: bash .github/scripts/smoke-assertions.sh port
      - name: Container is non-root, read-only and hardened
        run: bash .github/scripts/smoke-assertions.sh hardening
      - name: Container logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
      - name: Tear down
        if: always()
        run: docker compose down -v
      - name: SBOM (SPDX JSON, Syft)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/syft" scan docker:soc-range:local -o spdx-json=sbom.spdx.json
          jq -e '.spdxVersion and (.packages | length > 0)' sbom.spdx.json > /dev/null
          jq -r '"SBOM: \(.spdxVersion), \(.packages | length) packages"' sbom.spdx.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the image for the publish job
        id: save
        run: |
          set -euo pipefail
          docker save soc-range:local -o image.tar
          echo "image-id=$(docker image inspect soc-range:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-image
          path: image.tar
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 3

  changelog:
    name: Generate changelog (git-cliff)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GIT_CLIFF_VERSION: 2.14.2
      GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
      IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # git-cliff reads the full history and tags
          persist-credentials: false
      - name: Install git-cliff (version- and checksum-pinned)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  git-cliff.tar.gz" | sha256sum --check --strict
          tar -xzf git-cliff.tar.gz --strip-components=1 "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
      - name: Changes since the previous release
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = true ]; then
            "$RUNNER_TEMP/git-cliff" --config cliff.toml --current --strip all > changelog.md
          else
            # Dry run: the notes the next release would get if v$VERSION were tagged at this commit
            "$RUNNER_TEMP/git-cliff" --config cliff.toml --unreleased --tag "v$VERSION" --strip all > changelog.md
          fi
          test -s changelog.md
          cat changelog.md
      - name: Release notes preview (dry run)
        if: env.IS_TAG != 'true'
        env:
          TAG: v${{ needs.verify.outputs.version }}
          DIGEST: sha256:<image digest, filled in by the publish job>
        run: |
          set -euo pipefail
          { echo "## Release notes preview (dry run, nothing was released)"; echo;
            bash .github/scripts/release-notes.sh notes changelog.md; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: changelog
          path: changelog.md
          if-no-files-found: error
          retention-days: 3

  artifacts:
    name: Check release artifacts
    needs: [build, changelog]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Runs on every run, dry runs included: it downloads the artifacts with the same pinned download-artifact
    # action as publish and release, so a broken version of that action fails here, before a tag is pushed.
    # It only reads; nothing is pushed, signed or released.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: changelog
      - name: Image, SBOM and changelog are intact
        env:
          BUILT_ID: ${{ needs.build.outputs.image-id }}
        run: |
          set -euo pipefail
          docker load -i image.tar
          loaded=$(docker image inspect soc-range:local --format '{{.Id}}')
          echo "built image:  $BUILT_ID"
          echo "loaded image: $loaded"
          if [ -z "$BUILT_ID" ] || [ "$loaded" != "$BUILT_ID" ]; then
            echo "::error::downloaded image does not match the image the build job produced"; exit 1
          fi
          jq -e '.spdxVersion and (.packages | length > 0)' sbom.spdx.json > /dev/null
          test -s changelog.md
          {
            echo "Downloaded and checked: image \`$loaded\`,"
            echo "SBOM $(jq -r '.spdxVersion' sbom.spdx.json) ($(jq '.packages | length' sbom.spdx.json) packages),"
            echo "changelog ($(wc -l < changelog.md) lines). Nothing was pushed, signed or released by this job."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to GHCR, sign and attest
    needs: [verify, build, artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write      # push the image to ghcr.io
      id-token: write      # OIDC token for keyless cosign signing and for the provenance attestation
      attestations: write  # store the build provenance attestation
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      COSIGN_VERSION: 3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sbom
      - name: Install cosign (version- and checksum-pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum --check --strict
          chmod +x cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Push image (version and latest tags)
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker load -i image.tar
          docker tag soc-range:local "$IMAGE:$VERSION"
          docker tag soc-range:local "$IMAGE:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION" | tee push.log
          docker push "$IMAGE:latest"
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -n1 | cut -d' ' -f2)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in docker push output"; exit 1; }
          # Cross-check with the registry: both tags must resolve to the digest we sign
          for t in "$VERSION" latest; do
            reg=$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ "$reg" = "$digest" ] || { echo "::error::$IMAGE:$t is $reg, expected $digest"; exit 1; }
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest (tags $VERSION, latest)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sign and attest the SBOM, by digest (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Runs the README's "Verify a release" commands, as they will appear in the release notes
      - name: Verify the release with the documented commands
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-notes.sh commands > verify.sh
          cat verify.sh
          bash -euxo pipefail verify.sh
          echo "Documented verification passed for $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  release:
    name: Create GitHub Release
    needs: [verify, changelog, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # create the GitHub Release and upload the SBOM to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: changelog
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sbom
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-notes.sh notes changelog.md > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "sbom.spdx.json#SBOM (SPDX JSON)"
