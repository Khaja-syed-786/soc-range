name: Scorecard

# OpenSSF Scorecard: checks the repository against supply-chain security practices and uploads the results to
# code scanning (Security tab). publish_results also sends them to the public Scorecard API, which is what a
# badge would read. Not a required check: it runs on main, weekly and on demand, never on pull requests.
#
# With publish_results, Scorecard only accepts a restricted workflow: no workflow-level env, defaults or write
# permissions, Ubuntu GitHub-hosted runner, and only allowlisted steps in the job.

on:
  push:
    branches: [main]
  schedule:
    - cron: '29 6 * * 1'  # Mondays 06:29 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload the SARIF results to code scanning
      id-token: write         # OIDC token Scorecard uses to publish the results to its public API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
