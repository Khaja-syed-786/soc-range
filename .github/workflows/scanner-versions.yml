name: Scanner versions

# gitleaks, hadolint, Trivy, Syft, cosign and git-cliff run as version- and checksum-pinned binaries, which
# Dependabot can't see. This checks every pin (in ci.yml, docker.yml and release.yml) against each project's
# latest GitHub release once a week, flags a tool pinned differently in two workflows, and keeps a
# single tracking issue open while any pin is behind or drifting. Updating a pin is a manual PR: new version and
# new SHA-256 from the release's checksums.

on:
  schedule:
    - cron: '41 5 * * 1'  # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-versions
  cancel-in-progress: false

jobs:
  check:
    name: Check pinned scanner versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write  # open, update or close the tracking issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Pinned scanner versions are behind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned and latest versions
        id: compare
        run: |
          set -euo pipefail
          bash .github/scripts/scanner-versions.sh
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: steps.compare.outputs.behind == '1'
        run: |
          set -euo pipefail
          {
            echo "The weekly check found pinned tool versions behind their latest release, or pinned differently"
            echo "in two workflows."
            echo
            cat report.md
            echo
            echo "Pins: GITLEAKS_* in ci.yml; HADOLINT_* and TRIVY_* in docker.yml; TRIVY_*, SYFT_*, GIT_CLIFF_*"
            echo "and COSIGN_* in release.yml. To update one, change its \`*_VERSION\` and \`*_SHA256\`, taking the"
            echo "SHA-256 from the release's published checksums, in every workflow that pins that tool, and open"
            echo "a PR. Prefer releases that have been public for at least two weeks."
            echo
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "_Updated by the Scanner versions workflow, run ${run_url}_"
          } > body.md
          number=$(gh issue list --state open --search "in:title \"${ISSUE_TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            echo "Updated issue #${number}"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close the tracking issue when everything is current
        if: steps.compare.outputs.behind == '0'
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --search "in:title \"${ISSUE_TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All pinned scanner versions match their latest release."
            echo "Closed issue #${number}"
          else
            echo "No open tracking issue; nothing to do."
          fi
